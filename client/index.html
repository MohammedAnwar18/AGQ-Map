  <script>
    // منع ميزة "السحب للتحديث" (Pull-to-refresh) التي تخرب تجربة التطبيق
    document.addEventListener('touchmove', function (e) {
      if (e.touches.length > 1) {

  <link rel="manifest" href="/manifest.json" />

  <!-- بيانات منظّمة لمحركات البحث (تُبنى من الدومين الحالي) -->
  <script>
    (function () {
      var origin = window.location.origin;
      var canonical = document.getElementById('canonical-url');
      if (canonical) canonical.href = origin + '/';
      var ogUrl = document.getElementById('og-url');
      if (ogUrl) ogUrl.setAttribute('content', origin + '/');

      var ld = document.createElement('script');
      ld.type = 'application/ld+json';
      ld.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PalNovaa",
        "alternateName": "بالنوفا",
        "url": origin + '/',
        "description": document.querySelector('meta[name="description"]').content,
        "inLanguage": "ar",
        "potentialAction": {
          "@type": "SearchAction",
          "target": origin + '/map?q={search_term_string}',
          "query-input": "required name=search_term_string"
        }
      });
      document.head.appendChild(ld);
    })();
  </script>

  <link rel="stylesheet" href="/splash.css" />

<!-- GUARANTEED Splash Screen Removal (runs before React) -->
  <script>
    (function() {
      // رابط PalNovaa Foresight: أخفِ سبلاش الموقع العامّة فوراً (لصفحته سبلاشها الخاصّة)
      try {
        var p = (location.pathname || '').replace(/\/+$/, '');
        if (p.indexOf('/palnovaa-foresight') === 0 || p === '/foresight') {
          document.documentElement.classList.add('pn-foresight');
        }
      } catch (e) {}
      function hideSplash() {
        var splash = document.getElementById('splash-screen');
        if (splash) {
          splash.style.transition = 'opacity 0.5s ease';
          splash.style.opacity = '0';
          splash.style.pointerEvents = 'none';
          setTimeout(function() {
            splash.style.display = 'none';
            document.body.classList.remove('splash-active');
          }, 500);
        }
      }
      setTimeout(hideSplash, 10000); // 10s Safety Timeout
    })();
  </script>
</head>

<body class="splash-active">
  <div id="splash-screen">
    <div class="splash-glow" aria-hidden="true"></div>
    <div class="splash-grid" aria-hidden="true"></div>

    <div class="splash-content">
      <div class="logo-box">

        <div class="splash-ring" aria-hidden="true"></div>

          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="شعار التطبيق">
            <path fill="#FFFFFF" fill-rule="evenodd" d="M12 1.6c-4.09 0-7.4 3.31-7.4 7.4 0 5.55 7.4 13.4 7.4 13.4s7.4-7.85 7.4-13.4c0-4.09-3.31-7.4-7.4-7.4Zm0 10.35a2.95 2.95 0 1 1 0-5.9 2.95 2.95 0 0 1 0 5.9Z"/>
          </svg>
        </div>
      </div>

    <div class="splash-footer">

      </div>

      <!-- إشعار الحقوق. هذه الشاشة هي أوّل ما يُرسم قبل أن يُقلع
           React، فالإشعار هنا لا في المكوّن وحده — وإلّا لم يُرَ -->
      <p class="splash-rights">
        <span class="splash-rights-mark" id="splash-year">© 2026</span>
        <span class="splash-rights-brand">PalNovaa</span>
        <span class="splash-rights-text">All rights reserved</span>
      </p>
    </div>
  </div>

  <div id="root"></div>

  <script>
    /* سنة الحقوق من ساعة الجهاز، و2026 حدٌّ أدنى: إشعارٌ بسنة ماضية
       يبدو موقعاً مهجوراً، وساعةٌ خاطئة لا يجوز أن تُرجعه إلى الوراء.
       والقيمة مكتوبة في الوسم أصلاً فلا يُرى تغيّر هذا العام */
    (function () {
      try {
        var year = Math.max(2026, new Date().getFullYear());
        var node = document.getElementById('splash-year');
        if (node) node.textContent = '© ' + year;
      } catch (e) { /* يبقى المكتوب في الوسم */ }
    })();
  </script>

  <script type="module" src="/src/main.jsx"></script>

  <script>
    window.addEventListener('error', (e) => {
      if (e.message && (e.message.includes('Failed to fetch dynamically imported module') || e.message.includes('Importing a module script failed'))) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let registration of registrations) { registration.unregister(); }
            window.location.reload(true);
          });
        } else {
          window.location.reload(true);
        }
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => { console.log('✅ SW registered'); })
          .catch(error => { console.log('❌ SW failed:', error); });
      });
    }
  </script>
