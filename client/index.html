<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/logo.png" />

  <!-- Preload Critical Assets -->
  <link rel="preload" href="/logo.png" as="image" />
  <link rel="shortcut icon" href="/logo.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description"
    content="PalNovaa (بالنوفا) | شبكة اجتماعية ذكية تتيح لك اكتشاف الأماكن القريبة، مشاركة لحظاتك الاجتماعية، والتواصل مع الأصدقاء بسهولة وأمان." />
  <meta name="theme-color" content="#131417" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PalNovaa" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="PalNovaa" />
  <meta name="msapplication-navbutton-color" content="#131417" />
  <meta name="apple-touch-fullscreen" content="yes" />
  
  <script>
    // منع ميزة "السحب للتحديث" (Pull-to-refresh) التي تخرب تجربة التطبيق
    document.addEventListener('touchmove', function (e) {
      if (e.touches.length > 1) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>

  <link rel="manifest" href="/manifest.json" />
  <title>PalNovaa | خريطتك الاجتماعية</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Exo+2:wght@800;900&display=swap" rel="stylesheet">


  <style>
    :root {
      --bg-0: #0a1226;
      --splash-bg: #131417;
      --bg-1: #0f172a;
      --bg-2: #152043;
      --amber: #fbab15;
      --amber-soft: #ffd27a;
      --ink: #f8fafc;
      --ink-dim: rgba(248, 250, 252, .6);
      --grid: rgba(251, 171, 21, .07);
      --ring: rgba(251, 171, 21, .22);
    }

    * { box-sizing: border-box; }

    /* ============ Splash Screen ============ */
    #splash-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--splash-bg);
      display: grid;
      grid-template-rows: 1fr auto;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      z-index: 999999;
      isolation: isolate;
      font-family: 'IBM Plex Sans Arabic', 'Tajawal', system-ui, sans-serif;
      transition: opacity .6s cubic-bezier(0.65, 0, 0.35, 1), transform .6s cubic-bezier(0.65, 0, 0.35, 1), filter .6s ease;
    }

    #splash-screen.fade-out {
      opacity: 0;
      transform: scale(1.04);
      filter: blur(12px);
      pointer-events: none;
    }

    /* التوهج الكهرماني المحيط */
    .splash-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(58% 46% at 50% 38%, rgba(245, 163, 16, .16) 0%, rgba(245, 163, 16, .05) 45%, rgba(19, 20, 23, 0) 78%);
      animation: splashGlow 6s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes splashGlow {
      0%, 100% { opacity: .5; }
      50% { opacity: .85; }
    }

    /* شبكة الخريطة الخفيفة */
    .splash-grid {
      position: absolute;
      inset: 0;
      opacity: .5;
      background-image:
        linear-gradient(rgba(255, 255, 255, .028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .028) 1px, transparent 1px);
      background-size: 68px 68px;
      mask-image: radial-gradient(60% 50% at 50% 40%, #000 0%, transparent 75%);
      -webkit-mask-image: radial-gradient(60% 50% at 50% 40%, #000 0%, transparent 75%);
      z-index: 0;
    }

    /* محتوى الشعار والنص */
    .splash-content {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(22px, 4vh, 40px);
      text-align: center;
    }

    .logo-box {
      position: relative;
      display: grid;
      place-items: center;
      width: clamp(120px, 30vmin, 176px);
      height: clamp(120px, 30vmin, 176px);
    }

    /* الحلقات المتموجة */
    .splash-ring {
      position: absolute;
      inset: -46%;
      border-radius: 50%;
      border: 1px solid rgba(245, 163, 16, .45);
      animation: splashPing 3.4s cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
    }

    .splash-ring:nth-child(2) { border-color: rgba(245, 163, 16, .35); animation-delay: 1.15s; }
    .splash-ring:nth-child(3) { border-color: rgba(245, 163, 16, .25); animation-delay: 2.3s; }

    @keyframes splashPing {
      0% { transform: scale(.55); opacity: 0; }
      18% { opacity: .55; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    .logo-tile {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 26%;
      background: linear-gradient(160deg, #FFB829 0%, #F5A310 52%, #E08D05 100%);
      box-shadow:
        0 24px 60px -18px rgba(245, 163, 16, .55),
        inset 0 1px 0 rgba(255, 255, 255, .35);
      display: grid;
      place-items: center;
      animation: pinDrop 900ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes pinDrop {
      0% { transform: translateY(-28px) scale(.92); opacity: 0; }
      55% { transform: translateY(4px) scale(1.02); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .logo-tile svg {
      width: 56%;
      height: 56%;
      display: block;
      filter: drop-shadow(0 3px 6px rgba(120, 70, 0, .28));
    }

    /* النصوص */
    .splash-text-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: splashFadeUp 700ms cubic-bezier(0.22, 1, 0.36, 1) 420ms both;
    }

    @keyframes splashFadeUp {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .splash-title {
      margin: 0;
      direction: ltr;
      font-size: clamp(32px, 6.4vmin, 58px);
      font-weight: 700;
      letter-spacing: -.015em;
      line-height: 1.1;
      color: #FFFFFF;
    }

    .splash-tagline {
      margin: 0;
      max-width: 30ch;
      font-size: clamp(14px, 2.2vmin, 18px);
      font-weight: 300;
      line-height: 1.7;
      color: rgba(255, 255, 255, .62);
    }

    /* شريط التقدم والحالة */
    .splash-footer {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      animation: splashFadeUp 700ms cubic-bezier(0.22, 1, 0.36, 1) 720ms both;
    }

    .splash-progress {
      width: min(220px, 62vw);
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .09);
      overflow: hidden;
    }

    .splash-progress-bar {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(245, 163, 16, 0) 0%, #F5A310 55%, #FFC352 100%);
      animation: splashBar 2.1s cubic-bezier(0.45, 0, 0.2, 1) infinite;
    }

    @keyframes splashBar {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(0); }
    }

    .splash-status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: .1em;
      color: rgba(255, 255, 255, .34);
    }

    .splash-status .sep { color: rgba(255, 255, 255, .2); direction: ltr; }
    .splash-status .en { direction: ltr; letter-spacing: .14em; }

    @media (prefers-reduced-motion: reduce) {
      #splash-screen *, #splash-screen { animation: none !important; }
    }

    body.splash-active {
      overflow: hidden;
      background: var(--splash-bg);
      margin: 0;
      height: 100vh;
      height: 100dvh;
    }
  </style>

  <!-- GUARANTEED Splash Screen Removal (runs before React) -->
  <script>
    (function() {
      function hideSplash() {
        var splash = document.getElementById('splash-screen');
        if (splash) {
          splash.style.transition = 'opacity 0.5s ease';
          splash.style.opacity = '0';
          splash.style.pointerEvents = 'none';
          setTimeout(function() {
            splash.style.display = 'none';
            document.body.classList.remove('splash-active');
          }, 500);
        }
      }
      setTimeout(hideSplash, 10000); // 10s Safety Timeout
    })();
  </script>
</head>

<body class="splash-active">
  <div id="splash-screen">
    <div class="splash-glow" aria-hidden="true"></div>
    <div class="splash-grid" aria-hidden="true"></div>

    <div class="splash-content">
      <div class="logo-box">
        <div class="splash-ring" aria-hidden="true"></div>
        <div class="splash-ring" aria-hidden="true"></div>
        <div class="splash-ring" aria-hidden="true"></div>

        <div class="logo-tile">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="شعار التطبيق">
            <path fill="#FFFFFF" fill-rule="evenodd" d="M12 1.6c-4.09 0-7.4 3.31-7.4 7.4 0 5.55 7.4 13.4 7.4 13.4s7.4-7.85 7.4-13.4c0-4.09-3.31-7.4-7.4-7.4Zm0 10.35a2.95 2.95 0 1 1 0-5.9 2.95 2.95 0 0 1 0 5.9Z"/>
          </svg>
        </div>
      </div>

      <div class="splash-text-container">
        <h1 class="splash-title">PalNovaa</h1>
        <p class="splash-tagline">دليلك الأقرب إلى كل مكان حولك</p>
      </div>
    </div>

    <div class="splash-footer">
      <div class="splash-progress">
        <div class="splash-progress-bar"></div>
      </div>
      <span class="splash-status">
        جاري تحديد موقعك
        <span class="sep">·</span>
        <span class="en">LOCATING</span>
      </span>
    </div>
  </div>

  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>

  <script>
    window.addEventListener('error', (e) => {
      if (e.message && (e.message.includes('Failed to fetch dynamically imported module') || e.message.includes('Importing a module script failed'))) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let registration of registrations) { registration.unregister(); }
            window.location.reload(true);
          });
        } else {
          window.location.reload(true);
        }
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => { console.log('✅ SW registered'); })
          .catch(error => { console.log('❌ SW failed:', error); });
      });
    }
  </script>
</body>

</html>
