/* Layout: a drafting workbench over a live map — drawing surface fills the screen, property sheet under it on phones and beside it on wide screens */
:root{
  --bg:#E7EDEF; --surface:#F7FAFA; --surface-2:#DDE6E9; --ink:#14212B; --muted:#56676F; --line:#C2CED3;
  --accent:#0B7A80; --accent-ink:#FFFFFF; --measure:#A9500E; --danger:#B3261E;
  --fill:rgba(20,33,43,.10); --fill-sel:rgba(11,122,128,.22); --veil:rgba(247,250,250,.93);
  --grid-minor:#D6DFE2; --grid-major:#B4C3C9; --sky:#D9E4E7; --ground:#C9D2CF;
  --road:#5B6165; --walk:#D2CEC5; --mark:#F3F0E6; --plant:#6E9A57; --prop:#8A959B; --gps:#1A73E8;
  --vm-land:#F1EEE8; --vm-area:#E6E1D8; --vm-green:#CFE2BF; --vm-water:#AECFE3; --vm-bldg:#DCD3C8; --vm-bldg-line:#B9AC9C; --vm-road:#FFFFFF; --vm-casing:#C9C3B8; --vm-major:#F6D58E;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#43B9BF; --accent-ink:#052528; --measure:#F0A458; --danger:#F2867E;
  --fill:rgba(226,235,238,.10); --fill-sel:rgba(67,185,191,.26); --veil:rgba(21,32,39,.93);
  --grid-minor:#18242A; --grid-major:#283A43; --sky:#17242B; --ground:#25322F;
  --road:#3A4044; --walk:#4E524E; --mark:#D9D6CC; --plant:#5E8F4A; --prop:#6E7A80; --gps:#5EA2FF;
  --vm-land:#1A2328; --vm-area:#20292E; --vm-green:#22342A; --vm-water:#1C3445; --vm-bldg:#2E3438; --vm-bldg-line:#454C51; --vm-road:#3A4247; --vm-casing:#11181C; --vm-major:#6B5A33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161A; --surface:#152027; --surface-2:#1D2B33; --ink:#E2EBEE; --muted:#90A3AC; --line:#2A3B44;
  --accent:#43B9BF; --accent-ink:#052528; --measure:#F0A458; --danger:#F2867E;
  --fill:rgba(226,235,238,.10); --fill-sel:rgba(67,185,191,.26); --veil:rgba(21,32,39,.93);

*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}

.bar{position:relative;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{position:absolute;inset-inline:0;display:flex;align-items:center;justify-content:center;font:600 19px/1 var(--f-display);white-space:nowrap;pointer-events:none;color:var(--ink)}
.brand svg{width:22px;height:22px;color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:500 13px/1 var(--f-body);padding:8px 11px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.seg button svg{width:15px;height:15px;flex:0 0 auto}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(10,20,25,.18)}

.work{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:200px;overflow:hidden;background:var(--bg)}
#plan,#three{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#three canvas{display:block;touch-action:none}

.tools{position:absolute;top:10px;inset-inline:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;pointer-events:none}
.tools>*{pointer-events:auto}
.tools .seg{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);max-width:100%;overflow-x:auto;scrollbar-width:none}
.tools .seg button{flex-direction:column;gap:3px;padding:6px 9px;font-size:11px;min-width:52px}
.tools .seg button svg{width:17px;height:17px}
.tools .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.spacer{flex:1;pointer-events:none}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;min-width:38px;padding:0 11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font:500 13px/1 var(--f-body);cursor:pointer;white-space:nowrap}
.tb svg{width:17px;height:17px}
.tb[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.tb.primary,.tb.primary[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tb:disabled{opacity:.4;cursor:default}

.mapbtns{position:absolute;inset-inline-end:10px;bottom:56px;display:flex;flex-direction:column;gap:8px;transition:bottom .2s}
.mb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 6px rgba(10,20,25,.18)}
.mb svg{width:21px;height:21px}
.mb.on{color:var(--gps);border-color:var(--gps)}
.mb small{position:absolute;font:600 9px/1 var(--f-body);margin-top:30px}
.searchbox{position:absolute;top:10px;inset-inline:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(10,20,25,.18);padding:8px;display:grid;gap:6px;z-index:5}
.searchbox form{display:flex;gap:6px}
.searchbox input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:500 15px var(--f-body);padding:0 12px}
.results{display:grid;max-height:240px;overflow:auto}
.res{border:0;background:transparent;text-align:start;padding:9px 8px;border-radius:8px;cursor:pointer;display:grid;gap:1px}
.res:hover,.res:focus-visible{background:var(--fill-sel)}
.res b{font-weight:600}
.res small{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.palette{position:absolute;bottom:10px;inset-inline:10px;display:flex;gap:6px;overflow-x:auto;padding:6px;background:var(--veil);border:1px solid var(--line);border-radius:14px;scrollbar-width:none}
.pk{flex:0 0 auto;width:66px;display:grid;justify-items:center;gap:3px;padding:7px 4px 6px;border:1px solid transparent;background:transparent;border-radius:10px;cursor:pointer;font-size:11px;line-height:1.2;color:var(--ink)}
.pk svg{width:26px;height:26px;color:var(--muted)}
.pk span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk[aria-pressed="true"]{border-color:var(--accent);background:var(--fill-sel)}
.pk[aria-pressed="true"] svg{color:var(--accent)}
.pk.imp{border:1px dashed var(--line)}
.pk.imp svg{color:var(--accent)}

.hud{position:absolute;bottom:14px;inset-inline:64px;display:flex;justify-content:center;pointer-events:none;transition:bottom .2s}
.stage.has-palette .hud{bottom:100px}
.stage.has-palette .mapbtns{bottom:142px}
.stage.has-palette .attr{bottom:88px}
.hud span{background:var(--veil);border:1px solid var(--line);color:var(--muted);font-size:12px;padding:6px 12px;border-radius:999px;max-width:100%;text-align:center}
.hud span.toast{color:var(--ink);border-color:var(--accent)}
.attr{position:absolute;bottom:0;inset-inline-end:0;font-size:10px;color:var(--muted);background:var(--veil);padding:1px 6px;border-start-end-radius:0;border-start-start-radius:6px;direction:ltr;pointer-events:auto}
.attr a{color:inherit}

.sheet{background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;max-height:48%;min-height:0}
.shead{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 12px;border-bottom:1px solid var(--line)}
.grab{border:0;background:transparent;width:34px;height:34px;border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
.grab svg{width:18px;height:18px;transition:transform .2s}
.sheet.collapsed .grab svg{transform:rotate(180deg)}
.sheet.collapsed .sbody{display:none}
.shead .ttl{font:600 15px/1.2 var(--f-body);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shead .meta{color:var(--muted);font-size:12px;margin-inline-end:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.link{border:0;background:transparent;color:var(--danger);font-size:13px;padding:6px 4px;cursor:pointer;flex:0 0 auto}
.sbody{overflow:auto;padding:0 16px 16px;overscroll-behavior:contain;min-height:0}
@media (min-width:860px){
  .work{flex-direction:row}
  .sheet{max-height:none;width:360px;flex:0 0 360px;border-top:0;border-inline-start:1px solid var(--line)}
  .grab{display:none}
  .sheet.collapsed .sbody{display:block}
}

.chips{display:flex;gap:6px;overflow-x:auto;padding-block:12px 2px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--fill-sel)}
.sec{padding-block:14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.sec:last-child{border-bottom:0}
.sec h3{margin:0;font:600 12px/1.2 var(--f-body);letter-spacing:.03em;color:var(--muted)}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px}
.note{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
.note b{color:var(--ink);font-weight:500}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.unit{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
input[type=number]{width:86px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:500 14px var(--f-num);padding:0 8px;text-align:center;direction:ltr}
input[type=range]{accent-color:var(--accent);flex:1;min-width:110px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:var(--surface-2);width:36px;height:34px;font-size:18px;cursor:pointer}
.stepper output{min-width:44px;text-align:center;font:500 14px var(--f-num)}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;min-height:32px}
.chk input{accent-color:var(--accent);width:18px;height:18px;margin:0;flex:0 0 auto}
.sec .seg{width:100%}
.sec .seg button{flex:1;justify-content:center}
.slider{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.slider output{min-width:46px;text-align:end;font:500 12px var(--f-num);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}

.swatches{display:flex;gap:8px;overflow-x:auto;padding:3px 3px 6px;scrollbar-width:thin}
.sw{flex:0 0 auto;width:86px;height:66px;border-radius:8px;border:1px solid var(--line);background-color:var(--surface-2);background-size:cover;background-position:center;position:relative;cursor:pointer;padding:0;overflow:hidden}
.sw span{position:absolute;inset-inline:0;bottom:0;font:500 10px/1.3 var(--f-body);color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));padding:12px 6px 4px;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw.on{outline:2px solid var(--accent);outline-offset:2px}
.sw.plain{border-style:dashed;color:var(--accent);display:grid;place-items:center;align-content:center;gap:2px}
.sw.plain svg{width:20px;height:20px}
.sw.plain span{position:static;background:none;color:var(--ink);padding:0 4px;text-align:center;white-space:normal}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.cl{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0}
.cl.on{outline:2px solid var(--accent);outline-offset:2px}

.walls{display:grid;gap:4px}
.wrow{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;border:1px solid transparent;background:transparent;border-radius:8px;padding:5px 6px;cursor:pointer;text-align:start}
.wrow[aria-pressed="true"]{border-color:var(--accent);background:var(--fill-sel)}
.wrow i{width:40px;height:30px;border-radius:4px;background-size:cover;background-position:center;background-color:var(--surface-2);border:1px solid var(--line)}
.wrow small{display:block;color:var(--muted);font-size:11px}
.tag{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 7px}
.wpanel{border:1px solid var(--accent);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--fill-sel)}
.wpanel .h{display:flex;justify-content:space-between;gap:8px;font-weight:600;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;justify-self:start;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
.empty{padding-block:14px 4px;display:grid;gap:8px}
.empty h4{margin:0;font:600 16px var(--f-body)}
.empty ol{margin:0;padding-inline-start:20px;color:var(--muted);display:grid;gap:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

}

function offsets(pts,d){const n=pts.length,out=[];const nrm=(a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;return[-dy/L,dx/L];};

    else{const a=nrm(pts[i-1],pts[i]),b=nrm(pts[i],pts[i+1]);let mx=a[0]+b[0],my=a[1]+b[1];const ml=Math.hypot(mx,my)||1;mx/=ml;my/=ml;const k=1/Math.max(.25,mx*a[0]+my*a[1]);nx=mx*k;ny=my*k;}
    out.push([pts[i][0]+nx*d,pts[i][1]+ny*d]);}
  return out;}
/* تنعيم زوايا المسار بأقواسٍ دائرية (fillet) بدل الزوايا الحادّة 90° */
function roundedPath(pts,r){
  if(!pts||pts.length<3||!(r>0))return pts?pts.map(p=>p.slice()):[];
  const out=[pts[0].slice()];
  for(let i=1;i<pts.length-1;i++){
    const p0=pts[i-1],p1=pts[i],p2=pts[i+1];
    let v1x=p0[0]-p1[0],v1y=p0[1]-p1[1],v2x=p2[0]-p1[0],v2y=p2[1]-p1[1];
    const l1=Math.hypot(v1x,v1y)||1,l2=Math.hypot(v2x,v2y)||1;
    v1x/=l1;v1y/=l1;v2x/=l2;v2y/=l2;
    const ang=Math.acos(clamp(v1x*v2x+v1y*v2y,-1,1));
    if(ang<0.08||ang>Math.PI-0.08){out.push(p1.slice());continue;}
    const rad=Math.min(r,l1*0.5,l2*0.5),tan=rad/Math.tan(ang/2);
    const a=[p1[0]+v1x*tan,p1[1]+v1y*tan],b=[p1[0]+v2x*tan,p1[1]+v2y*tan];
    let bx=v1x+v2x,by=v1y+v2y;const bl=Math.hypot(bx,by)||1;bx/=bl;by/=bl;
    const cd=rad/Math.sin(ang/2),cx=p1[0]+bx*cd,cy=p1[1]+by*cd;
    let a0=Math.atan2(a[1]-cy,a[0]-cx),a1=Math.atan2(b[1]-cy,b[0]-cx),d=a1-a0;
    while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
    const N=Math.max(2,Math.round(Math.abs(d)/0.26));
    out.push(a);
    for(let k=1;k<N;k++){const t=a0+d*k/N;out.push([cx+rad*Math.cos(t),cy+rad*Math.sin(t)]);}
    out.push(b);
  }
  out.push(pts[pts.length-1].slice());
  return out;
}

  if(a==='fl-'||a==='fl+'){pushHist();o.floors=clamp(o.floors+(a==='fl+'?1:-1),1,80);changed();}
  else if(a==='resetOff'){pushHist();o.wall.offU=0;o.wall.offV=0;changed();}
  else if(a==='matchH'){const i=S.wallSel,ov=o.ov[i],tx=TEX[(ov&&ov.tex)||o.wall.tex];if(!tx)return;pushHist();o.floorH=+(edgeLen(o,i)*tx.h/tx.w/o.floors).toFixed(3);changed();toast(`ارتفاع المبنى الآن ${f2(heightOf(o))} م ويطابق الصورة`);}
  else if(a==='rot-'||a==='rot+'){pushHist();let r=o.rot+(a==='rot+'?90:-90);if(r>180)r-=360;if(r<-180)r+=360;o.rot=r;changed();}
  else if(a==='dup'){pushHist();const inf=info(o.kind)||{fw:2,fh:o.h};const c=Object.assign({},o,{id:uid(),x:+(o.x+Math.max(1,inf.fw*o.h/inf.fh+.5)).toFixed(2)});S.props.push(c);select('p',c.id);changed();toast('أُضيفت نسخة');}
});
$('#delB').addEventListener('click',()=>{
  const b=curB(),st=curS(),p=curP(),cu=curC();pushHist();
  if(b){S.buildings=S.buildings.filter(x=>x!==b);toast(`حُذف ${b.name} · اضغط تراجع لاسترجاعه`);}
  else if(st){S.streets=S.streets.filter(x=>x!==st);toast(`حُذف ${st.name} · اضغط تراجع لاسترجاعه`);}
  else if(cu){S.curbs=S.curbs.filter(x=>x!==cu);toast(`حُذف ${cu.name} · اضغط تراجع لاسترجاعه`);}
  else if(p){S.props=S.props.filter(x=>x!==p);toast('حُذف المجسّم · اضغط تراجع لاسترجاعه');}
  select(null);changed();});

function assignTex(target,id){const t=TEX[id];
  if(target==='road'||target==='walk'){const st=curS();if(!st)return;pushHist();
    if(target==='road'){st.tex=id;if(t&&t.mw)st.tileW=t.mw;}else{st.walkTex=id;if(t&&t.mw)st.walkW=t.mw;}changed();return;}
  const b=curB();if(!b)return;pushHist();
  if(target==='wall'){b.wall.tex=id;if(t&&t.mw&&b.wall.mode==='tile')b.wall.tileW=t.mw;if(t&&t.user&&b.wall.mode==='tile')b.wall.perFloor=false;}
  else if(target==='roof'){b.roof.tex=id;if(t&&t.mw&&b.roof.mode==='tile')b.roof.tileW=t.mw;}
  else if(target==='ov'&&S.wallSel!=null){if(id){const old=b.ov[S.wallSel];b.ov[S.wallSel]={tex:id,fit:old?old.fit:true};}else delete b.ov[S.wallSel];}
  changed();}

/* ---------- image import ---------- */
let importTarget=null;const fileIn=$('#fileIn');
fileIn.addEventListener('change',()=>{const f=fileIn.files&&fileIn.files[0];fileIn.value='';if(!f)return;
  const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{URL.revokeObjectURL(url);const iw=img.naturalWidth,ih=img.naturalHeight,s=Math.min(1,2048/Math.max(iw,ih)),w=Math.round(iw*s),h=Math.round(ih*s);
    const c=mkCanvas(w,h);c.getContext('2d').drawImage(img,0,0,w,h);
    const name=(f.name||'').replace(/\.[^.]+$/,'').slice(0,28)||'صورة',id='u'+uid(),durl=c.toDataURL('image/jpeg',.9);
    addTex({id,name,w,h,src:c,user:true,url:durl});DB.put(id,{kind:'tex',name,url:durl});
    assignTex(importTarget,id);toast(`أُضيفت الصورة بدقة ${w}×${h} بكسل`);};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('تعذّر فتح الصورة. جرّب ملف JPG أو PNG.');};
  img.src=url;});

/* ---------- map image + vector file import ---------- */
$('#mapImgIn').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{URL.revokeObjectURL(url);const iw=img.naturalWidth,ih=img.naturalHeight,sc=Math.min(1,4096/Math.max(iw,ih)),w=Math.round(iw*sc),h=Math.round(ih*sc);
    const c=mkCanvas(w,h);c.getContext('2d').drawImage(img,0,0,w,h);const durl=c.toDataURL('image/jpeg',.9);
    const im2=new Image();im2.onload=()=>placeImage(im2,(f.name||'خريطة').replace(/\.[^.]+$/,''),durl);im2.src=durl;};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('تعذّر فتح الصورة. جرّب ملف JPG أو PNG.');};img.src=url;});
$('#vecIn').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  if(f.size>60e6){toast('الملف كبير جدًا. صدّر منطقة أصغر من OpenStreetMap.');return;}
  toast('جارٍ قراءة ملف البيانات…');f.text().then(t=>setTimeout(()=>importVectorText(t,(f.name||'map').replace(/\.[^.]+$/,'')),30)).catch(()=>toast('تعذّر قراءة الملف.'));});

/* ---------- 3D model import ---------- */
const modelIn=$('#modelIn');
modelIn.addEventListener('change',()=>{const f=modelIn.files&&modelIn.files[0];modelIn.value='';if(!f)return;
  if(!HAS3){toast('محرّك 3D غير محمّل. أعد فتح الصفحة.');return;}
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(!['glb','gltf','obj'].includes(ext)){toast('الصيغ المدعومة: GLB أو GLTF أو OBJ.');return;}
  toast('جارٍ قراءة المجسّم…');
  f.arrayBuffer().then(buf=>parseModel(ext,buf).then(m=>{
    const id=uid(),name=f.name.replace(/\.[^.]+$/,'').slice(0,24)||'مجسّم';
    MODELS[id]=Object.assign(m,{id,name});DB.put('m-'+id,{kind:'model',id,name,ext,data:buf});
    S.propKind='m:'+id;renderPalette();setHint();
    const big=m.h>200||m.h<0.05;toast(big?`أُضيف «${name}». مقاسه غير مألوف، فاكتب ارتفاعه الحقيقي بعد وضعه`:`أُضيف «${name}» · انقر مكانه لوضعه`);
  })).catch(()=>toast('تعذّر فتح الملف. إذا كان GLTF بملفات منفصلة، صدّره كملف GLB واحد.'));});

/* ---------- theme + boot ---------- */
function onTheme(){readTokens();drawPlan();if(R){themeScene();build3D();}}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',onTheme);}catch(e){}
new MutationObserver(onTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(ART){['#btnSearch','#btnGps','#btnLayer'].forEach(q=>$(q).hidden=true);}
if(!load()&&ART)seed();setAttr();
new ResizeObserver(()=>{if(!V.inited&&pc.clientWidth){fitPlan();V.inited=true;}drawPlan();}).observe($('#stage'));
renderSheet();setHint();updUndo();renderPalette();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawPlan);
function takeStored(items){items.forEach(([k,v])=>{
  if(!v)return;
  if(v.kind==='tex'&&!TEX[k])loadTexURL(k,v.name,v.url);
  else if(v.kind==='model'&&HAS3&&!MODELS[v.id])parseModel(v.ext,v.data).then(m=>{MODELS[v.id]=Object.assign(m,{id:v.id,name:v.name});refreshSoon();}).catch(()=>{});
  else if(v.kind==='mapimg'&&S.img){const im=new Image();im.onload=()=>{IMG.el=im;IMG.name=v.name;refreshSoon();groundSoon(true);};im.src=v.url;}
  else if(v.kind==='vmap'&&Array.isArray(v.raw)){VM.raw=v.raw;VM.name=v.name;rebuildVM();setAttr();refreshSoon();groundSoon(true);}});}
DB.open().then(()=>DB.all()).then(takeStored).then(()=>ART?DB.legacy().then(takeStored):0);
})();
</script>
