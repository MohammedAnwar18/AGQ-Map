<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دخول المشرفين — البوابة الجغرافية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gp-1.0.css">
<style>
  /* شبكةٌ خرائطيّةٌ هادئةٌ خلف البطاقة */
  .lg{min-height:100vh;display:flex;flex-direction:column;
    background-color:var(--gp-bg);
    background-image:
      linear-gradient(to right,rgba(11,18,32,.035) 1px,transparent 1px),
      linear-gradient(to bottom,rgba(11,18,32,.035) 1px,transparent 1px);
    background-size:34px 34px}
  .lg-head{height:var(--gp-head-h);flex:none;display:flex;align-items:center;gap:14px;
    padding-inline:16px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);
    border-block-end:1px solid var(--gp-line)}
  .lg-main{flex:1;display:grid;place-items:center;padding:28px 16px}
  .lg-card{width:min(404px,100%);background:var(--gp-surface);border:1px solid var(--gp-line);
    border-radius:14px;box-shadow:var(--gp-shadow-lg);padding:28px}
  .lg-eyebrow{font-family:var(--gp-mono);font-size:11px;letter-spacing:.14em;
    color:var(--gp-accent);margin-bottom:8px}
  .lg-card h1{margin:0 0 6px;font-size:23px;font-weight:700;color:var(--gp-ink);letter-spacing:-.2px}
  .lg-card p.sub{margin:0 0 22px;font-size:13px;color:var(--gp-muted);line-height:1.75}
  .lg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px 0 18px}
  .lg-row label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--gp-ink-3);cursor:pointer}
  .lg-row a{font-size:12.5px;color:var(--gp-accent);font-weight:500}
  .lg-row a:hover{text-decoration:underline}
  .lg-foot{flex:none;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
    padding:14px 16px;font-size:11.5px;color:var(--gp-faint);border-block-start:1px solid var(--gp-line);
    background:rgba(255,255,255,.7)}
  .lg-err{display:none;margin:0 0 16px;padding:10px 12px;border-radius:9px;
    background:rgba(214,58,58,.08);border:1px solid rgba(214,58,58,.28);color:#9B2525;font-size:12.5px}
  .lg-err.on{display:block}
</style>
</head>
<body>
<div class="lg">

  <header class="lg-head">
    <a class="gp-brand" href="index.html">
      <span class="gp-brand__mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      </span>
      <span class="gp-brand__txt"><b>البوابة الجغرافية</b><small>Geoportal · نظام المعلومات الجغرافية</small></span>
    </a>
    <span class="gp-sp"></span>
    <a class="ib" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      <span>العودة إلى الخريطة</span>
    </a>
  </header>

  <main class="lg-main">
    <form class="lg-card" id="form" novalidate>
      <div class="lg-eyebrow">منطقة المشرفين</div>
      <h1>تسجيل الدخول</h1>
      <p class="sub">إدارة الطبقات والبيانات المكانية من مكان واحد.</p>

      <div class="lg-err" id="err"></div>

      <label class="gp-field">
        <span>البريد الإلكتروني</span>
        <input class="gp-input mono" type="email" id="email" name="email"
               placeholder="admin@example.ps" autocomplete="username" required>
      </label>

      <label class="gp-field">
        <span>كلمة المرور</span>
        <input class="gp-input" type="password" id="pass" name="password"
               placeholder="••••••••" autocomplete="current-password" required>
      </label>

      <div class="lg-row">
        <label><input class="sw" type="checkbox" id="remember" checked> تذكرني على هذا الجهاز</label>
        <a href="#" id="forgot">نسيت كلمة المرور؟</a>
      </div>

      <button class="gp-btn gp-btn--block" type="submit" id="submit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>
        <span>دخول إلى لوحة الإدارة</span>
      </button>
    </form>
  </main>

  <footer class="lg-foot">
    <span>© البوابة الجغرافية</span>
    <span class="gp-sep"></span>
    <span>اتصال آمن · HTTPS</span>
    <span class="gp-sep"></span>
    <span class="mono">EPSG:28191 · EPSG:28192 · EPSG:4326</span>
  </footer>
</div>

<script>
(function () {
  'use strict';
  var f = document.getElementById('form'), err = document.getElementById('err');
  function fail(m) { err.textContent = m; err.classList.add('on'); }

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    err.classList.remove('on');
    var email = document.getElementById('email').value.trim();
    var pass = document.getElementById('pass').value;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail('أدخل بريداً إلكترونيّاً صحيحاً.');
    if (pass.length < 6) return fail('كلمة المرور قصيرةٌ جداً.');

    var btn = document.getElementById('submit');
    btn.disabled = true;
    btn.querySelector('span').textContent = 'جارٍ التحقّق…';

    /* ⚠ استبدل هذا بنداءِ خادمك الحقيقيّ:
       fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'},
         body: JSON.stringify({ email, password: pass }) })
       لا تتحقّق من الهويّة في المتصفّح — هذا عرضٌ فقط. */
    setTimeout(function () { window.location.href = 'admin.html'; }, 500);
  });

  document.getElementById('forgot').addEventListener('click', function (e) {
    e.preventDefault();
    fail('راجع مدير النظام لإعادة تعيين كلمة المرور.');
  });
})();
</script>
</body>
</html>
