name = "palnovaa-apps"
main = "worker.js"
compatibility_date = "2024-11-01"

# اربط نفس حاوية R2 التي ينشر إليها المحرّك (R2_BUCKET_NAME في Vercel)
[[r2_buckets]]
binding = "APPS_BUCKET"
bucket_name = "REPLACE_WITH_YOUR_R2_BUCKET"   # ← ضع اسم حاوية R2 نفسها

# خلفيّة التطبيقات على الحافّة: قاعدة D1 واحدة، كلّ صفٍّ موسومٌ بالـslug (عزلٌ منطقيّ).
# أنشئها مرّةً:  npx wrangler d1 create palnovaa-app-db
# ثمّ ضع المعرّف الناتج في database_id أدناه (أو اربطها من اللوحة باسم APP_DB).
[[d1_databases]]
binding = "APP_DB"
database_name = "palnovaa-app-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
APPS_BASE = "palnovaa.com"

# بعد النشر، اربط الـWorker بالمسار من Cloudflare Dashboard → Workers → Routes:
#   *.palnovaa.com/*   → palnovaa-apps   (أوّل مستوى — مغطّى بشهادة SSL المجّانيّة)
# (أو عبر الحقل أدناه إن استعملت wrangler publish)
# [[routes]]
# pattern = "*.apps.palnovaa.com/*"
# zone_name = "palnovaa.com"
